[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairpp"
version = "4.0.0"
description = "Fairness post-processing"
authors = [
    { name = "Anderson Lucas" }
]
dependencies = [
    "torch",
    "torchjd",
    "numpy",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairpp*"]